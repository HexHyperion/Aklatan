services:
  server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    restart: always
    volumes:
      - ./aklatan.sql:/docker-entrypoint-initdb.d/aklatan.sql
    environment:
      POSTGRES_USER: aklatan
      POSTGRES_PASSWORD: aklatan
      POSTGRES_DB: aklatan
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aklatan" ]
      interval: 1s

  cron:
    image: imega/supercronic
    env_file:
      - .env
    volumes:
      - ./crontab:/etc/crontab
    command: [ "/etc/crontab" ]
    environment:
      - TZ=Europe/Warsaw